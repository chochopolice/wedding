# Google ドライブの写真・動画を Web 用に変換して、このリポジトリの GitHub Pages に公開するワークフロー
#
# 構成（リポジトリは wedding の1つだけ・Public）：
#   Google ドライブ … 「Wedding」フォルダ（中に scenes/ ceremony/ groom/ … のフォルダ）。元の写真はここだけに置く
#   wedding        … index.html・tools/・このファイル。公開は GitHub Pages（Source：GitHub Actions）
#
# 公開リポジトリなので守っていること：
#   ・元の写真（位置情報入り）はキャッシュにも成果物にも残さない。毎回、変わった分だけドライブから取得して変換し、捨てる
#     （公開リポジトリのキャッシュは、プルリクエストを作れる人なら誰でも読めるため）
#   ・キャッシュに入れるのは変換後のファイル（どうせ公開されるもの）だけ
#   ・ドライブの鍵は、ドライブに接続する2つのステップにだけ渡す
#   ・公開の権限（pages: write）は、他人のコードを実行しない deploy ジョブにだけ与える
#   ・Actions のログは誰でも見られるので、ファイル名を出さない（--quiet、rclone も詳細ログなし）
#
# 必要な Secrets（Settings → Secrets and variables → Actions）：
#   GDRIVE_SA_JSON    … Google のサービスアカウントの鍵（JSON の中身をそのまま）
#   GDRIVE_FOLDER_ID  … ドライブの「Wedding」フォルダの ID（URL の folders/ の後ろ）
#
# 動くタイミング：
#   ・1日3回（日本時間 6:23 / 12:23 / 18:23）ドライブを確認。変更が無ければ公開しない
#   ・main ブランチの tools/・index.html・このファイルが変わったとき
#   ・Actions タブの「Run workflow」ボタンを押したとき（すぐ反映したいとき）

name: Build media & deploy

on:
  schedule:
    - cron: '23 21,3,9 * * *'   # UTC 表記（日本時間 6:23 / 12:23 / 18:23）
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
    inputs:
      av1:
        description: 'TOPの動画を AV1 でも書き出す（軽くなるが時間がかかる）'
        type: boolean
        default: false
      full:
        description: '変更の有無にかかわらず全部作り直す'
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false   # 実行中の変換は止めず、次の実行は終わるまで待つ

permissions: {}   # 既定は権限なし。必要な分だけジョブごとに与える

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.site.outputs.changed }}
    env:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
      RCLONE_CONFIG_GDRIVE_SKIP_GDOCS: 'true'
      RCLONE_CONFIG_GDRIVE_SKIP_SHORTCUTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          SA: ${{ secrets.GDRIVE_SA_JSON }}
          FOLDER: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          missing=""
          [ -n "$SA" ] || missing="$missing GDRIVE_SA_JSON"
          [ -n "$FOLDER" ] || missing="$missing GDRIVE_FOLDER_ID"
          if [ -n "$missing" ]; then echo "::error::Secrets が未設定です:$missing（構築手順書の手順 4 を確認してください）"; exit 1; fi

      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg rclone

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: pip install --upgrade 'pillow>=11.3,<13' 'pillow-heif>=0.18,<2'

      # 前回の変換結果（公開済みのファイルと同じもの）だけを戻す。元の写真は入っていない
      - name: Restore converted media
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@v6
        with:
          path: |
            media
            .state
          key: media-none
          restore-keys: media-

      - name: List Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          rclone lsjson gdrive: -R --files-only --hash --fast-list -q > listing.json
          count=$(python -c "import json;print(len(json.load(open('listing.json'))))")
          echo "ドライブのファイル数：$count"
          if [ "$count" = "0" ]; then echo "::error::ドライブのフォルダが空か、サービスアカウントに共有されていません"; exit 1; fi

      - name: Plan
        run: python tools/prepare_media.py --listing listing.json --plan ${{ !inputs.full && '--incremental' || '' }} ${{ inputs.av1 && '--av1' || '' }} > plan.txt

      # 変わったフォルダ・ファイルだけ取得する（取得した元の写真は、このジョブが終わると消える）
      - name: Download changed files
        env:
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          mkdir -p raw
          n=0
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            rclone copyto "gdrive:$p" "raw/$p" --transfers 8 -q
            n=$((n + 1))
          done < plan.txt
          echo "取得：$n 件のフォルダ・ファイル / $(du -sh raw | cut -f1)"

      - name: Convert photos and videos
        run: python tools/prepare_media.py --listing listing.json --quiet ${{ !inputs.full && '--incremental' || '' }} ${{ inputs.av1 && '--av1' || '' }}

      - name: Remove original files
        if: ${{ always() }}
        run: rm -rf raw listing.json plan.txt

      - name: Assemble site
        id: site
        run: |
          rm -rf dist && mkdir dist
          cp index.html dist/
          cp -r media dist/
          # GitHub Pages は 1 サイト 1GB まで
          big=$(find dist -type f -size +95M)
          if [ -n "$big" ]; then echo "::error::95MB を超えるファイルがあります"; exit 1; fi
          total=$(du -sm dist | cut -f1)
          echo "サイト全体：${total}MB"
          if [ "$total" -gt 1000 ]; then echo "::error::サイト全体が ${total}MB です。GitHub Pages は 1GB までです"; exit 1; fi
          if [ "$total" -gt 850 ]; then echo "::warning::サイト全体が ${total}MB です。上限の 1GB に近づいています"; fi
          # 今の公開内容と同じなら公開しない（比較相手は実際に公開中のサイトの build.txt）
          hash=$( { (cd dist && find . -type f -not -name manifest.json -print0 | sort -z | xargs -0 sha256sum); grep -v '"generated"' media/manifest.json; } | sha256sum | cut -c1-24 )
          echo "$hash" > dist/build.txt
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          live=$(curl -fsS "https://${owner}.github.io/${{ github.event.repository.name }}/build.txt" 2>/dev/null || true)
          if [ "$hash" = "$live" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "公開中の内容と同じため、公開はスキップします"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # 次回の差分判定用に、変換結果が変わったときだけキャッシュを保存する
          key=$( { find media -type f -printf '%P %s\n' | sort; grep -v '"generated"' media/manifest.json; } | sha256sum | cut -c1-24 )
          echo "cache_key=$key" >> "$GITHUB_OUTPUT"
          if [ "$key" = "$(cat .state/key 2>/dev/null)" ]; then echo "save=false" >> "$GITHUB_OUTPUT"; else echo "save=true" >> "$GITHUB_OUTPUT"; fi
          mkdir -p .state && echo "$key" > .state/key

      - name: Save converted media for next run
        if: ${{ steps.site.outputs.save == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            media
            .state
          key: media-${{ steps.site.outputs.cache_key }}-${{ github.run_id }}

      - name: Upload site
        if: ${{ steps.site.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
